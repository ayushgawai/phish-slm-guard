[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="phishguard"
version="0.1.0"
description="SLM-based social-engineering detection for email and chat"
readme="README.md"
license={text="MIT"}
requires-python=">=3.11"
dependencies=[]
[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.5"]
sklearn=["scikit-learn>=1.4","numpy>=1.26"]
serve=["fastapi>=0.110","uvicorn>=0.29","onnxruntime>=1.17"]
onnx=["onnx>=1.16","skl2onnx>=1.16"]
qr=["qrcode[pil]>=7.4","Pillow>=10","opencv-python-headless>=4.9"]
slm=["torch>=2.2","transformers>=4.40","peft>=0.10","datasets>=2.19","accelerate>=0.30"]
all=["scikit-learn>=1.4","numpy>=1.26","fastapi>=0.110","uvicorn>=0.29","onnxruntime>=1.17","qrcode[pil]>=7.4","Pillow>=10"]
[project.scripts]
phishguard-eval="phishguard.evaluate:main"
phishguard-serve="phishguard.serve:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
[tool.ruff]
line-length=100
target-version="py311"
[tool.ruff.lint]
select=["E9","F63","F7","F82"]
ignore=[]
